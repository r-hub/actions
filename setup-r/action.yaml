name: 'r-hub/actions/setup-r'
description: |
  Install and setup R for R-hub jobs.
author: 'Gábor Csárdi'

inputs:
  job-config:
    description: |
      The matrix config, as set up by the `setup` action.
  token:
    description: |
      Custom GitHub personal access token. Useful to allow access to
      private repositories or other resources.

runs:
  using: "composite"
  steps:
  - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
    with:
      r-version: ${{ fromJson(inputs.job-config).r-version }}
      use-public-rspm: true
    env:
      NOT_CRAN: false
  - name: Set up R-hub repository
    run: |
      #
      source("set-rhub-repos.R")
      main()
    shell: Rscript {0}
    working-directory: ${{github.action_path}}
  - uses: r-hub/actions/setup-r-sysreqs@ddb9ff764f93fec9da46ed3f551d805c4dcb415a # v1
    with:
      type: full
