name: "r-hub/actions/checkout"
description: |
  Check out a repo, a wrapper to https://github.com/actions/checkout.
author: 'Gábor Csárdi'

inputs:
  repository:
    description: >
      Repository name with owner. For example, actions/checkout.
    default: ${{ github.repository }}
  ref:
    description: >
      The branch, tag or SHA to checkout. When checking out the repository that
      triggered a workflow, this defaults to the reference or SHA for that
      event.  Otherwise, uses the default branch.
  submodules:
    description: >
      Whether to checkout submodules: `true` to checkout submodules or
      `recursive` to recursively checkout submodules. Forwarded to
      `actions/checkout`.
    default: false
  autocrlf:
    description: >
      Git's `core.autocrlf` setting to use for the checkout. By default this
      is left at the runner's default (`true` on Windows, converting LF line
      endings to CRLF on checkout). Set to `false` to check out files with
      their original line endings, e.g. to avoid `R CMD check` warnings about
      CRLF line endings in files such as `configure.ac`.
    default: ''

runs:
  using: "composite"
  steps:
  - name: Configure git core.autocrlf
    if: inputs.autocrlf != ''
    run: git config --global core.autocrlf ${{ inputs.autocrlf }}
    shell: bash
  - uses: actions/checkout@v6
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      submodules: ${{ inputs.submodules }}
